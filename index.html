<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>LLM Chat</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:       #0f1117;
      --surface:  #1a1d27;
      --border:   #2a2d3e;
      --accent:   #6c63ff;
      --accent2:  #a78bfa;
      --text:     #e2e8f0;
      --muted:    #64748b;
      --user-bg:  #6c63ff22;
      --bot-bg:   #1e2235;
      --radius:   14px;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg);
      color: var(--text);
      height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    header {
      width: 100%;
      max-width: 760px;
      padding: 20px 24px 16px;
      display: flex;
      align-items: center;
      gap: 12px;
      border-bottom: 1px solid var(--border);
    }
    .logo {
      width: 36px; height: 36px;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
      font-size: 18px;
    }
    header h1 { font-size: 1.1rem; font-weight: 600; }
    #status-badge {
      margin-left: auto;
      font-size: 0.72rem;
      padding: 3px 10px;
      border-radius: 999px;
      font-weight: 500;
      border: 1px solid var(--border);
      color: var(--muted);
    }
    #status-badge.ready  { color: #4ade80; border-color: #4ade8044; }
    #status-badge.error  { color: #f87171; border-color: #f8717144; }

    #chat-box {
      flex: 1;
      width: 100%;
      max-width: 760px;
      overflow-y: auto;
      padding: 24px 16px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      scroll-behavior: smooth;
    }

    .msg {
      display: flex;
      gap: 10px;
      max-width: 88%;
      animation: fadeUp 0.25s ease;
    }
    .msg.user { align-self: flex-end; flex-direction: row-reverse; }
    .msg.bot  { align-self: flex-start; }

    .avatar {
      width: 32px; height: 32px; border-radius: 50%;
      flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      font-size: 14px;
    }
    .msg.user .avatar { background: var(--accent); }
    .msg.bot  .avatar { background: var(--bot-bg); border: 1px solid var(--border); }

    .bubble {
      padding: 12px 16px;
      border-radius: var(--radius);
      line-height: 1.6;
      font-size: 0.9rem;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .msg.user .bubble {
      background: var(--user-bg);
      border: 1px solid var(--accent)55;
      border-bottom-right-radius: 4px;
    }
    .msg.bot .bubble {
      background: var(--bot-bg);
      border: 1px solid var(--border);
      border-bottom-left-radius: 4px;
    }

    .typing span {
      display: inline-block;
      width: 6px; height: 6px;
      border-radius: 50%;
      background: var(--muted);
      animation: blink 1.2s infinite;
      margin: 0 2px;
    }
    .typing span:nth-child(2) { animation-delay: 0.2s; }
    .typing span:nth-child(3) { animation-delay: 0.4s; }

    #input-area {
      width: 100%;
      max-width: 760px;
      padding: 16px;
      border-top: 1px solid var(--border);
    }
    #input-row {
      display: flex;
      gap: 10px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 8px 12px;
      transition: border-color 0.2s;
    }
    #input-row:focus-within { border-color: var(--accent); }

    #user-input {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: var(--text);
      font-family: 'Inter', sans-serif;
      font-size: 0.9rem;
      resize: none;
      max-height: 120px;
      line-height: 1.5;
    }
    #user-input::placeholder { color: var(--muted); }

    #send-btn {
      width: 36px; height: 36px;
      border: none;
      border-radius: 10px;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      color: #fff;
      cursor: pointer;
      font-size: 16px;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
      align-self: flex-end;
      transition: opacity 0.2s, transform 0.1s;
    }
    #send-btn:hover   { opacity: 0.85; transform: scale(1.05); }
    #send-btn:active  { transform: scale(0.95); }
    #send-btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }

    #hint { font-size: 0.72rem; color: var(--muted); margin-top: 8px; text-align: center; }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(8px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @keyframes blink {
      0%, 80%, 100% { opacity: 0.2; }
      40%           { opacity: 1; }
    }
  </style>
</head>
<body>

<header>
  <div class="logo">🤖</div>
  <h1>LLM Chat</h1>
  <span id="status-badge">Checking…</span>
</header>

<div id="chat-box">
  <div class="msg bot">
    <div class="avatar">🤖</div>
    <div class="bubble">Hello! I'm your AI assistant. Ask me anything.</div>
  </div>
</div>

<div id="input-area">
  <div id="input-row">
    <textarea id="user-input" rows="1" placeholder="Type a message… (Enter to send)"></textarea>
    <button id="send-btn" title="Send">➤</button>
  </div>
  <p id="hint">Powered by Qwen 1.5 · 0.5B · Q4_K_M · llama.cpp</p>
</div>

<script>
  const chatBox   = document.getElementById('chat-box');
  const input     = document.getElementById('user-input');
  const sendBtn   = document.getElementById('send-btn');
  const badge     = document.getElementById('status-badge');

  // ── Status polling ────────────────────────────────────────────────────────
  async function pollStatus() {
    try {
      const r = await fetch('/health');
      const d = await r.json();
      if (d.status === 'ready') {
        badge.textContent = '● Ready';
        badge.className   = 'ready';
        sendBtn.disabled  = false;
        return;  // stop polling
      } else if (d.status === 'error') {
        badge.textContent = '✗ Error';
        badge.className   = 'error';
        sendBtn.disabled  = true;
        return;
      }
      badge.textContent = '⏳ Loading model…';
      sendBtn.disabled  = true;
    } catch { badge.textContent = 'Connecting…'; }
    setTimeout(pollStatus, 3000);
  }
  pollStatus();

  // ── Auto-resize textarea ──────────────────────────────────────────────────
  input.addEventListener('input', () => {
    input.style.height = 'auto';
    input.style.height = Math.min(input.scrollHeight, 120) + 'px';
  });

  // ── Send on Enter (Shift+Enter = newline) ─────────────────────────────────
  input.addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
  });
  sendBtn.addEventListener('click', sendMessage);

  // ── Append message bubble ─────────────────────────────────────────────────
  function addMessage(role, text) {
    const wrap   = document.createElement('div');
    wrap.className = `msg ${role}`;
    const avatar = document.createElement('div');
    avatar.className = 'avatar';
    avatar.textContent = role === 'user' ? '👤' : '🤖';
    const bubble = document.createElement('div');
    bubble.className = 'bubble';
    bubble.textContent = text;
    wrap.append(avatar, bubble);
    chatBox.appendChild(wrap);
    chatBox.scrollTop = chatBox.scrollHeight;
    return bubble;
  }

  function addTyping() {
    const wrap   = document.createElement('div');
    wrap.className = 'msg bot';
    wrap.id = 'typing-indicator';
    const avatar = document.createElement('div');
    avatar.className = 'avatar';
    avatar.textContent = '🤖';
    const bubble = document.createElement('div');
    bubble.className = 'bubble typing';
    bubble.innerHTML = '<span></span><span></span><span></span>';
    wrap.append(avatar, bubble);
    chatBox.appendChild(wrap);
    chatBox.scrollTop = chatBox.scrollHeight;
  }

  // ── Main send logic ───────────────────────────────────────────────────────
  async function sendMessage() {
    const text = input.value.trim();
    if (!text || sendBtn.disabled) return;

    addMessage('user', text);
    input.value = '';
    input.style.height = 'auto';
    sendBtn.disabled = true;
    addTyping();

    try {
      const res  = await fetch('/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ message: text }),
      });
      const data = await res.json();
      document.getElementById('typing-indicator')?.remove();

      if (!res.ok) {
        addMessage('bot', `⚠️ ${data.detail || 'Something went wrong.'}`);
      } else {
        addMessage('bot', data.response);
      }
    } catch (err) {
      document.getElementById('typing-indicator')?.remove();
      addMessage('bot', '⚠️ Network error. Please try again.');
    } finally {
      sendBtn.disabled = false;
      input.focus();
    }
  }
</script>
</body>
</html>
